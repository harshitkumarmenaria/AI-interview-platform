<!DOCTYPE html>
<html>
<head>
    <title>Resume Evaluation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glass-card fade-in">
    <h2>Resume Evaluation</h2>
    <p class="muted">Upload your resume (PDF)</p>

    <input type="file" id="resumeFile" accept="application/pdf">

    <button onclick="uploadResume()">Evaluate Resume</button>

    <div id="spinner" class="spinner hidden"></div>

    <p id="result" class="result"></p>

    <button class="link-btn" onclick="goBack()">← Back to Dashboard</button>
</div>

<script src="script.js"></script>
<script>
function goBack() {
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("user_id");
    window.location.href = `dashboard.html?user_id=${userId}`;
}
</script>

</body>
</html>
